# Production example only. Mount certificates read-only and enable this file
# instead of default.conf after replacing the server name and certificate paths.
upstream teamflow_backend_tls {
    server server:8080;
    keepalive 32;
}

server {
    listen 8080;
    server_name teamflow.example.com;
    return 301 https://teamflow.example.com$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name teamflow.example.com;

    ssl_certificate /run/secrets/teamflow_tls_certificate;
    ssl_certificate_key /run/secrets/teamflow_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 21m;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-cache" always;

    location /api/notifications/stream {
        proxy_pass http://teamflow_backend_tls;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35m;
    }

    location /api/ {
        proxy_pass http://teamflow_backend_tls;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri @asset_not_found;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @asset_not_found {
        add_header Cache-Control "no-cache" always;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
