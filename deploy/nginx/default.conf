upstream teamflow_backend {
    server server:8080;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 21m;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Cache-Control "no-cache" always;

    location /api/notifications/stream {
        proxy_pass http://teamflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35m;
    }

    location /api/ {
        proxy_pass http://teamflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri @asset_not_found;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @asset_not_found {
        add_header Cache-Control "no-cache" always;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
