services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    environment:
      MYSQL_DATABASE: teamflow
      MYSQL_USER: teamflow
      MYSQL_PASSWORD: ${TEAMFLOW_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TEAMFLOW_DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${TEAMFLOW_MIDDLEWARE_BIND_ADDRESS:-127.0.0.1}:${TEAMFLOW_MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${TEAMFLOW_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: public.ecr.aws/docker/library/redis:7.4-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${TEAMFLOW_REDIS_PASSWORD}"]
    ports:
      - "${TEAMFLOW_MIDDLEWARE_BIND_ADDRESS:-127.0.0.1}:${TEAMFLOW_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${TEAMFLOW_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: public.ecr.aws/docker/library/rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: ${TEAMFLOW_RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${TEAMFLOW_RABBIT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${TEAMFLOW_MIDDLEWARE_BIND_ADDRESS:-127.0.0.1}:${TEAMFLOW_RABBIT_HOST_PORT:-5672}:5672"
      - "${TEAMFLOW_MIDDLEWARE_BIND_ADDRESS:-127.0.0.1}:${TEAMFLOW_RABBIT_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
