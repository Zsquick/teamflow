services:
  web:
    ports:
      - "443:8443"
    volumes:
      - ./nginx/tls-example.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - teamflow_tls_certificate
      - teamflow_tls_private_key
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate --quiet --output-document=/dev/null https://127.0.0.1:8443/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  teamflow_tls_certificate:
    file: ${TEAMFLOW_TLS_CERTIFICATE_FILE:?set TEAMFLOW_TLS_CERTIFICATE_FILE to an absolute certificate path}
  teamflow_tls_private_key:
    file: ${TEAMFLOW_TLS_PRIVATE_KEY_FILE:?set TEAMFLOW_TLS_PRIVATE_KEY_FILE to an absolute private-key path}
