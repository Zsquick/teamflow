services:
  server:
    build:
      context: ..
      dockerfile: teamflow-server/Dockerfile
    environment:
      TEAMFLOW_DB_URL: jdbc:mysql://mysql:3306/teamflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      TEAMFLOW_DB_USERNAME: teamflow
      TEAMFLOW_DB_PASSWORD: ${TEAMFLOW_DB_PASSWORD}
      TEAMFLOW_DB_POOL_SIZE: ${TEAMFLOW_DB_POOL_SIZE:-10}
      TEAMFLOW_DB_MIN_IDLE: ${TEAMFLOW_DB_MIN_IDLE:-2}
      TEAMFLOW_DB_CONNECTION_TIMEOUT: ${TEAMFLOW_DB_CONNECTION_TIMEOUT:-3000}
      TEAMFLOW_DB_VALIDATION_TIMEOUT: ${TEAMFLOW_DB_VALIDATION_TIMEOUT:-2000}
      TEAMFLOW_REDIS_HOST: redis
      TEAMFLOW_REDIS_PASSWORD: ${TEAMFLOW_REDIS_PASSWORD}
      TEAMFLOW_RABBIT_HOST: rabbitmq
      TEAMFLOW_RABBIT_USERNAME: ${TEAMFLOW_RABBIT_USERNAME}
      TEAMFLOW_RABBIT_PASSWORD: ${TEAMFLOW_RABBIT_PASSWORD}
      TEAMFLOW_JWT_SECRET_BASE64: ${TEAMFLOW_JWT_SECRET_BASE64}
      TEAMFLOW_CORS_ALLOWED_ORIGINS: ${TEAMFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      TEAMFLOW_FLYWAY_ENABLED: "true"
      TEAMFLOW_STORAGE_ROOT: /app/uploads
      TEAMFLOW_WEBHOOK_ENABLED: ${TEAMFLOW_WEBHOOK_ENABLED:-false}
      TEAMFLOW_WEBHOOK_ENDPOINT: ${TEAMFLOW_WEBHOOK_ENDPOINT:-https://example.invalid/teamflow-events}
      TEAMFLOW_WEBHOOK_HMAC_SECRET: ${TEAMFLOW_WEBHOOK_HMAC_SECRET:-disabled}
      TEAMFLOW_RATE_LIMIT_ENABLED: ${TEAMFLOW_RATE_LIMIT_ENABLED:-true}
      TEAMFLOW_LOGIN_RATE_LIMIT: ${TEAMFLOW_LOGIN_RATE_LIMIT:-10}
      TEAMFLOW_LOGIN_RATE_WINDOW: ${TEAMFLOW_LOGIN_RATE_WINDOW:-PT1M}
      TEAMFLOW_REGISTRATION_RATE_LIMIT: ${TEAMFLOW_REGISTRATION_RATE_LIMIT:-5}
      TEAMFLOW_REGISTRATION_RATE_WINDOW: ${TEAMFLOW_REGISTRATION_RATE_WINDOW:-PT10M}
      TEAMFLOW_REFRESH_RATE_LIMIT: ${TEAMFLOW_REFRESH_RATE_LIMIT:-30}
      TEAMFLOW_REFRESH_RATE_WINDOW: ${TEAMFLOW_REFRESH_RATE_WINDOW:-PT1M}
      TEAMFLOW_UPLOAD_RATE_LIMIT: ${TEAMFLOW_UPLOAD_RATE_LIMIT:-30}
      TEAMFLOW_UPLOAD_RATE_WINDOW: ${TEAMFLOW_UPLOAD_RATE_WINDOW:-PT1M}
      TEAMFLOW_OUTBOX_BATCH_SIZE: ${TEAMFLOW_OUTBOX_BATCH_SIZE:-50}
      TEAMFLOW_OUTBOX_MAX_ATTEMPTS: ${TEAMFLOW_OUTBOX_MAX_ATTEMPTS:-5}
      TEAMFLOW_OUTBOX_CLAIM_TTL: ${TEAMFLOW_OUTBOX_CLAIM_TTL:-PT30S}
      TEAMFLOW_OUTBOX_CONFIRM_TIMEOUT: ${TEAMFLOW_OUTBOX_CONFIRM_TIMEOUT:-PT5S}
      TEAMFLOW_OUTBOX_RETRY_INITIAL_DELAY: ${TEAMFLOW_OUTBOX_RETRY_INITIAL_DELAY:-PT2S}
      TEAMFLOW_OUTBOX_RETRY_MAX_DELAY: ${TEAMFLOW_OUTBOX_RETRY_MAX_DELAY:-PT1M}
      TEAMFLOW_OUTBOX_SCAN_INTERVAL: ${TEAMFLOW_OUTBOX_SCAN_INTERVAL:-PT2S}
      TEAMFLOW_SCHEDULER_POOL_SIZE: ${TEAMFLOW_SCHEDULER_POOL_SIZE:-3}
    volumes:
      - upload-data:/app/uploads
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: teamflow-web/Dockerfile
    ports:
      - "${TEAMFLOW_WEB_HOST_PORT:-8088}:8080"
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      server:
        condition: service_healthy

volumes:
  upload-data:
